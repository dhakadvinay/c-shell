<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Vinay Dhakad</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-light">
    <script>
        let savedTheme = localStorage.getItem('myTheme');
        if (savedTheme) {
            document.body.className = savedTheme;
        }
    </script>
    <header>
        <div class="logo">@.Vinay.Dhakad</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html" aria-current="page">Contact</a>
            <button id="theme-btn">Toggle Theme</button>
        </nav>
    </header>

    <main>
        <h1>Contact Me</h1>

        <div id="form-container" class="scroll-fade">
            <form id="contact-form">
                <div class="input-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" required>
                    <span id="name-error" class="error-text"></span>
                </div>

                <div class="input-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                    <span id="email-error" class="error-text"></span>
                </div>

                <div class="input-group">
                    <label for="message">Message:</label>
                    <textarea id="message" rows="5" required></textarea>
                    <span id="message-error" class="error-text"></span>
                </div>

                <button type="submit" class="button">Submit</button>
            </form>
        </div>

        <div id="success-message" style="display: none; background: #d4edda; color: #155724; padding: 20px; border-radius: 5px;">
            <h2>Success!</h2>
            <p>Your message has been validated and simulated sending.</p>
        </div>

    </main>

    <script src="main.js"></script>
    <script src="contact.js"></script>
</body>
</html>
